<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pip-Boy promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
  :root { --g: #14F814; --g2: rgba(20,248,20,.55); --g3: rgba(20,248,20,.18); }
  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: 'Roboto Condensed', sans-serif; color: var(--g); text-transform: uppercase;
  }
  .a { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .glow { text-shadow: 0 0 6px rgba(20,248,20,.9), 0 0 24px rgba(20,248,20,.45), 0 0 60px rgba(20,248,20,.2); }
  .mono { font-family: 'Share Tech Mono', monospace; }
  .w { display: inline-block; will-change: transform, opacity; }
  .center { text-align: center; white-space: nowrap; }

  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(20,248,20,.10), transparent 70%),
      linear-gradient(rgba(20,248,20,.045) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(20,248,20,.045) 1px, transparent 1px) 0 0 / 48px 48px,
      #000;
  }
  #world { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #scan {
    position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
  }
  #vig { position: absolute; inset: 0; z-index: 51; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.65) 100%); }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 52; opacity: .07; mix-blend-mode: screen; }
  #flash { position: absolute; inset: 0; z-index: 60; background: #d9ffd9; opacity: 0; }

  /* Monitor */
  .screen { width: 1600px; height: 900px; border-radius: 18px; background: #000;
    box-shadow: 0 0 0 10px #071007, 0 0 0 12px rgba(20,248,20,.45), 0 0 50px 8px rgba(20,248,20,.25), 0 40px 120px rgba(0,0,0,.9); }
  .view { position: absolute; inset: 0; overflow: hidden; border-radius: 16px; }
  .cam { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
  .cam img, .cam canvas { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; }
  .glass { position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 70%, rgba(255,255,255,.04) 100%); }

  .kicker { font-family: 'Share Tech Mono', monospace; font-size: 30px; letter-spacing: .18em; color: rgba(20,248,20,.8); }
  .h1 { font-weight: 900; line-height: .95; letter-spacing: .01em; }
  .sub { font-size: 34px; letter-spacing: .06em; color: rgba(20,248,20,.85); }
  .pill { display: inline-block; white-space: nowrap; padding: 10px 22px; border: 2px solid var(--g); background: rgba(20,248,20,.08);
    font-family: 'Share Tech Mono', monospace; letter-spacing: .06em; text-transform: none; }
  .callout { display: flex; align-items: center; gap: 16px; font-size: 30px; letter-spacing: .04em; white-space: nowrap; }
  .callout b { display: grid; place-items: center; width: 58px; height: 58px; background: var(--g); color: #000; font-size: 38px; text-shadow: none; }
  .callout span { color: rgba(20,248,20,.7); }
  .tag { padding: 14px 28px; background: rgba(0,0,0,.78); border-left: 6px solid var(--g); font-size: 46px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
  .tag small { display: block; font-size: 26px; font-weight: 400; letter-spacing: .12em; color: rgba(20,248,20,.75); }
  .list { font-size: 34px; line-height: 1.55; letter-spacing: .03em; white-space: nowrap; }
  .side { width: 660px; white-space: normal; text-align: left; }
  .side.narrow { width: 620px; }

  /* Chapter strip */
  #strip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 40; pointer-events: none; }
  .chap { position: absolute; top: 1040px; transform: translate(-50%, 0); font-family: 'Share Tech Mono', monospace;
    font-size: 19px; letter-spacing: .12em; color: rgba(20,248,20,.35); white-space: nowrap; }
  .chap.on { color: var(--g); text-shadow: 0 0 6px rgba(20,248,20,.9); }
  .tick { position: absolute; top: 1028px; width: 2px; height: 10px; background: rgba(20,248,20,.5); }
  #rail { position: absolute; left: 140px; top: 1032px; width: 1640px; height: 2px; background: rgba(20,248,20,.35); }
  #railfill { position: absolute; left: 140px; top: 1031px; height: 4px; background: var(--g); box-shadow: 0 0 10px var(--g); }

  /* Themes */
  .themeimg { width: 1920px; height: 1080px; object-fit: cover; }
  .phone { width: 330px; height: 714px; border-radius: 44px; background: #000; padding: 0;
    box-shadow: 0 0 0 9px #0b140b, 0 0 0 11px rgba(20,248,20,.5), 0 0 40px rgba(20,248,20,.3), 0 30px 80px rgba(0,0,0,.9); overflow: hidden; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 40px; }

  .letter { display: inline-grid; place-items: center; width: 96px; height: 110px; margin: 0 8px; border: 3px solid rgba(20,248,20,.35);
    font-family: 'Share Tech Mono', monospace; font-size: 84px; color: rgba(20,248,20,.25); }
  .letter.on { border-color: var(--g); color: var(--g); text-shadow: 0 0 10px var(--g); background: rgba(20,248,20,.08); }
  .letter.live { background: var(--g); color: #000; text-shadow: none; }
  .scopebox { width: 700px; height: 240px; border: 2px solid rgba(20,248,20,.45);
    background: linear-gradient(rgba(20,248,20,.12) 1px, transparent 1px) 0 0 / 100% 12.5%, linear-gradient(90deg, rgba(20,248,20,.12) 1px, transparent 1px) 0 0 / 8.333% 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="world"></div>
  <div id="strip"></div>
  <div id="scan"></div>
  <div id="vig"></div>
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="flash"></div>
</div>
<script>
'use strict';
const FPS = 30;
const DURATION = 48;
const W = 1920, H = 1080, CX = 960, CY = 540;
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const strip = document.getElementById('strip');
const flashEl = document.getElementById('flash');

// ── Tiny keyframe engine ────────────────────────────────────────────────────
const EASE = {
  lin: x => x,
  out: x => 1 - Math.pow(1 - x, 3),
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  in: x => x * x * x,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const PROPS = { x: 0, y: 0, s: 1, sx: 1, sy: 1, o: 1, rx: 0, ry: 0, rz: 0, blur: 0, br: 1 };
const tracks = [];
const updaters = [];

function el(tag, cls, parent = world, html = '') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
/** anchor = 'center' (element centered on left/top) or 'free' (plain transform). */
/**
 * Keyframes hold their values: a property a keyframe does not mention keeps the
 * value it had at the previous keyframe (the first keyframe starts from defaults).
 */
function anim(e, kfs, { anchor = 'center', left = CX, top = CY } = {}) {
  if (anchor === 'center') { e.style.left = left + 'px'; e.style.top = top + 'px'; }
  const sorted = kfs.slice().sort((a, b) => a.t - b.t);
  let state = { ...PROPS };
  const full = sorted.map(k => { state = { ...state, ...k }; return state; });
  tracks.push({ e, kfs: full, anchor });
  return e;
}
function evalTrack(kfs, t) {
  if (t <= kfs[0].t) return kfs[0];
  for (let i = 1; i < kfs.length; i++) {
    const b = kfs[i];
    if (t < b.t) {
      const a = kfs[i - 1];
      const u = EASE[b.e || 'out'](Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));
      const out = {};
      for (const p in PROPS) out[p] = a[p] + (b[p] - a[p]) * u;
      return out;
    }
  }
  return kfs[kfs.length - 1];
}
function applyTrack(tr, t) {
  const v = evalTrack(tr.kfs, t);
  const st = tr.e.style;
  st.opacity = v.o;
  st.visibility = v.o <= 0.002 ? 'hidden' : 'visible';
  const c = tr.anchor === 'center' ? 'translate(-50%,-50%) ' : '';
  st.transform = `${c}translate3d(${v.x}px,${v.y}px,0) perspective(2000px) rotateX(${v.rx}deg) rotateY(${v.ry}deg) rotateZ(${v.rz}deg) scale(${v.s * v.sx},${v.s * v.sy})`;
  const f = [];
  if (v.blur > 0.05) f.push(`blur(${v.blur.toFixed(2)}px)`);
  if (Math.abs(v.br - 1) > 0.01) f.push(`brightness(${v.br.toFixed(2)})`);
  st.filter = f.length ? f.join(' ') : 'none';
}
/** Visible only inside [a, b) with quick fades. */
function span(a, b, fadeIn = 0.25, fadeOut = 0.25, extra = {}) {
  return [
    { t: a - 0.001, o: 0, ...extra.from },
    { t: a + fadeIn, o: 1, ...extra.to, e: extra.ein || 'out' },
    { t: b - fadeOut, o: 1 },
    { t: b, o: 0, ...extra.exit, e: 'in' },
  ];
}
/** Split text into words that rise in with a stagger. */
function words(parent, text, start, { stagger = 0.07, dur = 0.55, dy = 70, end = null, outDur = 0.25 } = {}) {
  text.split(' ').forEach((w, i) => {
    const s = el('span', 'w', parent, w);
    parent.appendChild(document.createTextNode(' '));
    const t0 = start + i * stagger;
    const k = [{ t: t0, o: 0, y: dy, blur: 10 }, { t: t0 + dur, o: 1, y: 0, blur: 0, e: 'outExpo' }];
    if (end !== null) k.push({ t: end - outDur, o: 1, y: 0 }, { t: end, o: 0, y: -40, e: 'in' });
    anim(s, k, { anchor: 'free' });
  });
}
function block(cls, html, x, y, kfs, parent = world) {
  const e = el('div', 'a ' + cls, parent, html);
  return anim(e, kfs, { left: x, top: y });
}

// ── Seeded noise for grain & glitch ─────────────────────────────────────────
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const grainCtx = document.getElementById('grain').getContext('2d');
const grainImg = grainCtx.createImageData(960, 540);
function drawGrain(frame) {
  const r = mulberry(frame * 9973 + 1);
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  grainCtx.putImageData(grainImg, 0, 0);
}

// ── Image helpers ───────────────────────────────────────────────────────────
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    const im = new Image();
    im.src = src;
    imgCache.set(src, im.decode().then(() => im).catch(() => im));
    if (imgCache.size > 40) imgCache.delete(imgCache.keys().next().value);
  }
  return imgCache.get(src);
}
const clipMeta = {};
async function loadClipMeta(name) {
  clipMeta[name] = await (await fetch(`clips/${name}/frames.json`)).json();
}
function clipFrameAt(name, local) {
  const fr = clipMeta[name];
  let k = 0;
  while (k < fr.length - 1 && fr[k + 1].t <= local) k++;
  const a = fr[k], b = fr[Math.min(k + 1, fr.length - 1)];
  const frac = b.t > a.t ? Math.min(1, Math.max(0, (local - a.t) / (b.t - a.t))) : 0;
  return { a: `clips/${name}/${String(a.i).padStart(4, '0')}.jpg`, b: `clips/${name}/${String(b.i).padStart(4, '0')}.jpg`, frac };
}

// ── Monitor ─────────────────────────────────────────────────────────────────
const screen = el('div', 'a screen');
const view = el('div', 'view', screen);
const cam = el('div', 'cam', view);
const shotImg = el('img', '', cam);
const clipCanvas = el('canvas', '', cam);
clipCanvas.width = 1600; clipCanvas.height = 900;
const clipCtx = clipCanvas.getContext('2d');
el('div', 'glass', screen);

// Content schedule for the monitor: still images or clips (with frame blending).
const SCREEN = [
  { t: 8.0, img: 'shots/stat-status.jpg' },
  { t: 12.0, clip: 'special-nav', from: 0.15, speed: 1.0 },
  { t: 15.1, img: 'shots/stat-special-i.jpg' },
  { t: 16.0, img: 'shots/inv-weapons.jpg' },
  { t: 17.0, img: 'shots/inv-apparel.jpg' },
  { t: 18.0, img: 'shots/inv-aid-coffee.jpg' },
  { t: 19.0, img: 'shots/inv-ammo.jpg' },
  { t: 20.0, img: 'shots/data-quests.jpg' },
  { t: 24.0, img: 'shots/map-local.jpg' },
  { t: 25.2, mix: ['shots/map-local.jpg', 'shots/map-world.jpg'], dur: 0.9 },
  { t: 26.1, img: 'shots/map-world.jpg' },
  { t: 28.0, clip: 'radio', from: 0.2, speed: 1.0 },
  { t: 36.0, img: 'shots/terminal.jpg' },
  { t: 38.0, img: 'shots/hack.jpg' },
];
let currentImg = '';
updaters.push(async t => {
  let cur = null;
  for (const s of SCREEN) if (s.t <= t) cur = s;
  if (!cur) return;
  if (cur.mix) {
    const [A, B] = await Promise.all(cur.mix.map(loadImg));
    const u = EASE.inOut(Math.min(1, Math.max(0, (t - cur.t) / cur.dur)));
    clipCtx.globalAlpha = 1;
    clipCtx.drawImage(A, 0, 0, 1600, 900);
    clipCtx.globalAlpha = u;
    clipCtx.drawImage(B, 0, 0, 1600, 900);
    clipCanvas.style.display = '';
    shotImg.style.display = 'none';
    currentImg = '';
  } else if (cur.img) {
    clipCanvas.style.display = 'none';
    shotImg.style.display = '';
    if (currentImg !== cur.img) {
      currentImg = cur.img;
      await loadImg(cur.img);
      shotImg.src = cur.img;
      await shotImg.decode().catch(() => {});
    }
  } else {
    const local = cur.from + (t - cur.t) * cur.speed;
    const f = clipFrameAt(cur.clip, local);
    const [A, B] = await Promise.all([loadImg(f.a), loadImg(f.b)]);
    clipCtx.globalAlpha = 1;
    clipCtx.drawImage(A, 0, 0, 1600, 900);
    if (f.frac > 0.05) { clipCtx.globalAlpha = f.frac; clipCtx.drawImage(B, 0, 0, 1600, 900); }
    clipCanvas.style.display = '';
    shotImg.style.display = 'none';
  }
});

// Monitor placement over the whole film.
anim(screen, [
  { t: 7.95, o: 0, s: 1.3, blur: 24, rx: 28, y: 120, x: 0, ry: 0 },
  { t: 8.55, o: 1, s: 0.86, blur: 0, rx: 9, y: 50, e: 'outExpo' },
  { t: 11.9, s: 0.9, rx: 4, ry: -5, y: 50, x: 0, e: 'inOut' },
  // SPECIAL: monitor left, text right
  { t: 12.5, x: -335, y: 20, s: 0.66, rx: 2, ry: 12, e: 'outExpo' },
  { t: 15.8, x: -325, s: 0.67, ry: 10, e: 'lin' },
  // INV: nearly full frame
  { t: 16.35, x: 0, y: 70, s: 0.9, rx: 0, ry: 0, e: 'outExpo' },
  { t: 19.9, s: 0.91, e: 'lin' },
  // DATA: monitor right, text left
  { t: 20.5, x: 300, y: 20, s: 0.66, ry: -12, rx: 2, e: 'outExpo' },
  { t: 23.9, x: 290, ry: -9, e: 'lin' },
  // MAP: centered
  { t: 24.5, x: 0, y: 50, s: 0.9, ry: 0, rx: 6, e: 'outExpo' },
  { t: 27.9, s: 0.92, rx: 3, e: 'lin' },
  // RADIO: monitor left, scope right
  { t: 28.5, x: -350, y: 20, s: 0.6, ry: 14, rx: 2, e: 'outExpo' },
  { t: 31.6, o: 1, e: 'lin' },
  { t: 31.95, o: 0, s: 0.55, blur: 12, e: 'in' },
  // TERMINAL
  { t: 35.95, o: 0, x: 0, y: 60, s: 1.1, ry: 0, rx: 14, blur: 16 },
  { t: 36.45, o: 1, s: 0.9, rx: 5, blur: 0, e: 'outExpo' },
  { t: 39.6, o: 1, s: 0.93, rx: 3, e: 'lin' },
  { t: 40.0, o: 0, s: 0.75, blur: 14, e: 'in' },
], { left: CX, top: CY });

// Camera moves inside the monitor (x/y are screen px after scale).
function camAt(tx, ty, s, t, e = 'inOut') { return { t, x: -tx * s, y: -ty * s, s, e }; }
anim(cam, [
  camAt(0, 0, 1, 8.0), camAt(20, 10, 1.05, 11.9, 'lin'),
  camAt(0, 0, 1, 12.0, 'lin'),
  camAt(0, 0, 1, 15.9, 'lin'),
  // INV: frame the item list + detail
  camAt(732, 92, 1.85, 16.0, 'lin'), camAt(745, 100, 1.88, 17.0, 'lin'),
  camAt(732, 92, 1.85, 17.001, 'lin'), camAt(745, 100, 1.88, 18.0, 'lin'),
  camAt(732, 92, 1.85, 18.001, 'lin'), camAt(745, 100, 1.88, 19.0, 'lin'),
  camAt(732, 92, 1.85, 19.001, 'lin'), camAt(745, 100, 1.88, 20.0, 'lin'),
  // DATA: pan down the quest detail
  camAt(735, 60, 1.85, 20.001, 'lin'), camAt(735, 400, 1.85, 23.8, 'inOut'),
  // MAP: start on the map pane, pull back while it switches to the world map
  camAt(645, 150, 1.68, 23.95, 'lin'), camAt(645, 170, 1.7, 25.2, 'lin'), camAt(0, 0, 1, 26.4, 'inOut'),
  camAt(0, 0, 1, 35.9, 'lin'),
  // TERMINAL & HACK: frame the dialog
  camAt(150, 60, 1.15, 36.0, 'lin'), camAt(170, 70, 1.18, 37.95, 'lin'),
  camAt(150, 60, 1.15, 38.0, 'lin'), camAt(175, 75, 1.2, 40, 'lin'),
], { anchor: 'free' });

// ── Scene 0: CRT power-on + boot text (0 → 3) ───────────────────────────────
const bootLines = [
  'ROBCO INDUSTRIES (TM) TERMLINK PROTOCOL',
  '> PIP-OS(R) V7.1.0.8',
  '> CARGANDO PERFIL DEL MORADOR...',
  '> JUAN PABLO SÁNCHEZ REY',
  '> DESARROLLADOR FULL STACK ........ [ OK ]',
];
const bootBox = el('div', 'a mono glow');
Object.assign(bootBox.style, { fontSize: '44px', lineHeight: '1.55', whiteSpace: 'pre', textTransform: 'uppercase' });
anim(bootBox, [{ t: 0, o: 1 }, { t: 2.92, o: 1 }, { t: 3.0, o: 0, e: 'lin' }], { anchor: 'free' });
bootBox.style.left = '170px'; bootBox.style.top = '250px';
const bootFull = bootLines.join('\n');
updaters.push(t => {
  if (t > 3.05) return;
  const p = Math.min(1, Math.max(0, (t - 0.55) / 2.3));
  const n = Math.floor(p * bootFull.length);
  const cursor = Math.floor(t * 3) % 2 === 0 ? '▌' : ' ';
  bootBox.textContent = bootFull.slice(0, n) + cursor;
});
// The CRT "line" that opens into the picture.
anim(world, [
  { t: 0, sy: 0.004, sx: 0.6, br: 3 },
  { t: 0.22, sy: 0.004, sx: 1, br: 3, e: 'out' },
  { t: 0.5, sy: 1, sx: 1, br: 1, e: 'outExpo' },
  { t: 47.25, sy: 1, sx: 1, br: 1 },
  { t: 47.55, sy: 0.004, sx: 1, br: 3, e: 'in' },
  { t: 47.8, sy: 0.004, sx: 0.002, br: 3, e: 'in' },
], { anchor: 'free' });
world.style.transformOrigin = '50% 50%';

// ── Scene 1: kinetic title (3 → 8) ──────────────────────────────────────────
{
  const l1 = el('div', 'a h1 glow center'); Object.assign(l1.style, { fontSize: '170px' });
  words(l1, 'HICE MI WEB', 3.08, { end: 4.45 });
  anim(l1, [{ t: 3, o: 1 }], { top: 420 });
  const l2 = el('div', 'a h1 glow center'); Object.assign(l2.style, { fontSize: '170px' });
  words(l2, 'PERSONAL', 3.3, { end: 4.45 });
  anim(l2, [{ t: 3, o: 1 }], { top: 590 });

  const l3 = el('div', 'a h1 glow center'); Object.assign(l3.style, { fontSize: '88px' });
  words(l3, 'Y NO ES UN PORTAFOLIO', 4.5, { stagger: 0.06, end: 5.55 });
  anim(l3, [{ t: 4, o: 1 }], { top: 470 });
  const l4 = el('div', 'a h1 glow center'); Object.assign(l4.style, { fontSize: '88px' });
  words(l4, 'CUALQUIERA.', 4.75, { end: 5.55 });
  anim(l4, [{ t: 4, o: 1 }], { top: 580 });

  block('h1 center sub', 'ES UN', CX, 330, [{ t: 5.6, o: 0, y: 30 }, { t: 5.9, o: 1, y: 0 }, { t: 7.95, o: 1 }, { t: 8.0, o: 0, e: 'lin' }]).style.fontSize = '64px';
  const pip = block('h1 glow center', 'PIP-BOY', CX, 520, [
    { t: 5.75, o: 0, s: 1.6, blur: 30 }, { t: 6.15, o: 1, s: 1, blur: 0, e: 'outExpo' },
    { t: 7.95, s: 1.1, e: 'in' }, { t: 8.0, o: 0, s: 1.3, e: 'lin' },
  ]);
  pip.style.fontSize = '300px';
  block('mono glow center', '3000 MARK IV · INSPIRADO EN FALLOUT 4', CX, 720, [

// ── Chapter strip with walking Vault Boy (8 → 44) ───────────────────────────
const CHAPTERS = [
  [8, 'STAT'], [12, 'S.P.E.C.I.A.L.'], [16, 'INV'], [20, 'DATA'], [24, 'MAP'],
  [28, 'RADIO'], [32, 'TEMAS'], [36, 'TERMINAL'], [40, 'MÓVIL'],
];
const railX = i => 140 + (1640 / (CHAPTERS.length - 1)) * i;
el('div', '', strip).id = 'rail';
const railFill = el('div', '', strip); railFill.id = 'railfill';
const chapEls = CHAPTERS.map(([, name], i) => {
  const tk = el('div', 'tick', strip); tk.style.left = railX(i) + 'px';
  const c = el('div', 'chap', strip, `${String(i + 1).padStart(2, '0')} ${name}`);
  c.style.left = railX(i) + 'px';
  return c;
});
const walker = el('img', '', strip);
Object.assign(walker.style, { position: 'absolute', height: '74px', top: '956px', filter: 'drop-shadow(0 0 6px rgba(20,248,20,.6))' });
const vbMeta = { 'walk': { n: 19, d: [100, 100, 100, 100, 100, 100, 100, 100, 100, 200, 100, 100, 100, 200, 100, 100, 100, 100, 100] }, 'thumbs-up': { n: 14, d: Array(14).fill(100) } };
function vbFrame(name, local, loop = true) {
  const m = vbMeta[name];
  const total = m.d.reduce((a, b) => a + b, 0) / 1000;
  let x = loop ? ((local % total) + total) % total : Math.min(local, total - 0.001);
  for (let k = 0; k < m.n; k++) { x -= m.d[k] / 1000; if (x < 0) return `vb/${name}-${String(k).padStart(2, '0')}.png`; }
  return `vb/${name}-${String(m.n - 1).padStart(2, '0')}.png`;
}
let walkerSrc = '';
updaters.push(async t => {
  const visible = t >= 8 && t < 44;
  strip.style.opacity = visible ? Math.min(1, (t - 8) / 0.4, (44 - t) / 0.3) : 0;
  if (!visible) return;
  // progress along the rail: reach each chapter tick at its start time
  let x = railX(0);
  for (let i = 0; i < CHAPTERS.length; i++) {
    const [s] = CHAPTERS[i];
    const e = CHAPTERS[i + 1] ? CHAPTERS[i + 1][0] : 44;
    if (t >= s) x = railX(i) + (railX(i + 1 < CHAPTERS.length ? i + 1 : i) - railX(i)) * Math.min(1, (t - s) / (e - s)) * (i + 1 < CHAPTERS.length ? 1 : 0);
    chapEls[i].classList.toggle('on', t >= s && t < e);
  }
  railFill.style.width = (x - 140) + 'px';
  walker.style.left = (x - 26) + 'px';
  const src = vbFrame('walk', t - 8);
  if (src !== walkerSrc) { walkerSrc = src; await loadImg(src); walker.src = src; await walker.decode().catch(() => {}); }
});

// ── Scene 7: RADIO (28 → 32) ───────────────────────────────────────────────
const MORSE = { J: '.---', P: '.--.', S: '...', R: '.-.' };
const MORSE_UNIT = 0.08, MORSE_START = 28.3;
const morseTones = [];
{
  let t = MORSE_START;
  'JPSR'.split('').forEach((ch, ci) => {
    const code = MORSE[ch];
    [...code].forEach((sym, k) => {
      const len = (sym === '.' ? 1 : 3) * MORSE_UNIT;
      morseTones.push({ a: t, b: t + len, ci, sym });
      t += len + (k < code.length - 1 ? MORSE_UNIT : 0);
    });
    t += 3 * MORSE_UNIT;
  });
}
{
  const x = 1460;
  block('kicker side', '06 · RADIO', x, 210, span(28.4, 32, 0.3, 0.25, { from: { x: 40 }, to: { x: 0 } }));
  const h = el('div', 'a h1 glow side'); Object.assign(h.style, { fontSize: '84px', whiteSpace: 'nowrap' });
  words(h, 'RADIO DEL YERMO', 28.45, { stagger: 0.06, end: 32 });
  anim(h, [{ t: 0, o: 1 }], { left: x, top: 300 });
  block('sub side', 'BALIZA MORSE GENERADA EN TIEMPO REAL', x, 385, span(28.8, 32, 0.4, 0.25));

  const scope = block('scopebox', '', x, 560, span(28.6, 32, 0.4, 0.25, { from: { s: 0.94 }, to: { s: 1 } }));
  const cv = el('canvas', '', scope); cv.width = 700; cv.height = 240;
  Object.assign(cv.style, { position: 'absolute', inset: '0', filter: 'drop-shadow(0 0 6px rgba(20,248,20,.9))' });
  const sctx = cv.getContext('2d');
  const letters = block('center', 'JPSR'.split('').map(c => `<span class="letter">${c}</span>`).join(''), x, 780, span(28.7, 32, 0.4, 0.25));
  const code = block('mono glow center', '', x, 880, span(28.7, 32, 0.3, 0.25));
  code.style.fontSize = '48px';
  let amp = 0;
  updaters.push(t => {
    if (t < 28.5 || t > 32) return;
    const tone = morseTones.find(m => t >= m.a && t < m.b);
    const target = tone ? 0.85 : 0;
    amp = target; // deterministic per frame
    sctx.clearRect(0, 0, 700, 240);
    sctx.strokeStyle = '#14F814';
    sctx.lineWidth = 3;
    sctx.beginPath();
    const r = mulberry(Math.floor(t * FPS) + 77);
    for (let px = 0; px <= 700; px += 3) {
      const u = px / 700;
      const y = Math.sin(u * Math.PI * 2 * 9 + t * 40) * amp * 0.42 + (r() - 0.5) * (tone ? 0.05 : 0.08);
      const py = 120 - y * 220;
      px === 0 ? sctx.moveTo(px, py) : sctx.lineTo(px, py);
    }
    sctx.stroke();
    const sent = morseTones.filter(m => m.a <= t);
    const ci = sent.length ? sent[sent.length - 1].ci : -1;
    [...letters.children].forEach((l, i) => {
      l.className = 'letter' + (i < ci ? ' on' : i === ci ? (tone ? ' live' : ' on') : '');
    });
    code.textContent = ci >= 0 ? `${'JPSR'[ci]}  ${MORSE['JPSR'[ci]].replace(/\./g, '•').replace(/-/g, '—').split('').join(' ')}` : '';
  });
}

{

    label.style.transform = `translate(-50%,-50%) scale(${1 + 0.12 * Math.exp(-local / 0.1)})`;
  });
}

// ── Flashes & glitches ─────────────────────────────────────────────────────
const FLASHES = [[3.0, 0.5], [8.0, 0.9], [16.0, 0.25], [24.0, 0.25], [32.0, 0.5], [36.0, 0.3], [44.0, 0.6]];
const GLITCHES = [[2.95, 0.18], [5.75, 0.12], [7.85, 0.15], [31.85, 0.15], [43.9, 0.12]];
updaters.push(t => {
  const bgEl = document.getElementById('bg');
  bgEl.style.opacity = t < 47.2 ? 1 : Math.max(0, 1 - (t - 47.2) / 0.3);
  let f = 0;
  for (const [a, s] of FLASHES) if (t >= a) f = Math.max(f, s * Math.exp(-(t - a) / 0.09));
  flashEl.style.opacity = f.toFixed(3);
  const g = GLITCHES.find(([a, d]) => t >= a && t < a + d);
  if (g) {
    const r = mulberry(Math.floor(t * FPS) * 31 + 5);
    stage.style.filter = `drop-shadow(${(r() * 14 - 7).toFixed(1)}px 0 0 rgba(255,0,90,.75)) drop-shadow(${(r() * -14 + 7).toFixed(1)}px 0 0 rgba(0,220,255,.75))`;
    document.getElementById('bg').style.transform = `translateX(${(r() * 30 - 15).toFixed(1)}px)`;
  } else {
    stage.style.filter = 'none';
    document.getElementById('bg').style.transform = 'none';
  }
});

// ── Driver ─────────────────────────────────────────────────────────────────
window.ready = (async () => {
  await Promise.all([
    document.fonts.load('900 100px "Roboto Condensed"'),
    document.fonts.load('700 100px "Roboto Condensed"'),
    document.fonts.load('400 100px "Roboto Condensed"'),
    document.fonts.load('40px "Share Tech Mono"'),
  ]);
  await document.fonts.ready;
  await Promise.all(['special-nav', 'map-zoom', 'radio'].map(loadClipMeta));
  return true;
})();

window.renderFrame = async t => {
  for (const tr of tracks) applyTrack(tr, t);
  for (const u of updaters) await u(t);
  drawGrain(Math.round(t * FPS));
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};
